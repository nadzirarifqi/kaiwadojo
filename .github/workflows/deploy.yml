name: Deploy KaiwaDoJo ke CyberPanel / Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via LFTP
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: kaiwa-dojo-app/package-lock.json

      - name: Install Dependencies
        working-directory: kaiwa-dojo-app
        run: npm ci

      - name: Build Production Bundle
        working-directory: kaiwa-dojo-app
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || '/api' }}
          VITE_ADMIN_WA_NUMBER: ${{ secrets.VITE_ADMIN_WA_NUMBER || '087875018001' }}

      - name: Copy API Backend & .htaccess ke dist/
        working-directory: kaiwa-dojo-app
        run: |
          cp -r api dist/api
          cp public/.htaccess dist/.htaccess || true

      - name: Deploy via LFTP ke Server
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
          FTP_HOST: ${{ secrets.FTP_SERVER || '36.50.114.44' }}
          FTP_PORT: ${{ secrets.FTP_PORT || 21 }}
          FTP_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -qq -y lftp
          lftp -c "
            set ftp:ssl-allow yes
            set ssl:verify-certificate no
            set ftp:passive-mode on
            set net:connection-limit 1
            set net:max-retries 10
            set net:timeout 30
            set net:reconnect-interval-base 2
            open -u \"$FTP_USER\",\"$FTP_PASS\" -p $FTP_PORT $FTP_HOST
            mirror --reverse \
                   --delete=false \
                   --verbose \
                   --exclude-glob uploads/ \
                   --exclude-glob kaiwa-1-courses/ \
                   --exclude-glob kaiwa-2-courses/ \
                   ./kaiwa-dojo-app/dist/ $FTP_DIR
            bye
          "
