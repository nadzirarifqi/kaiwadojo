<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <!-- Viewport & PWA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b91c1c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Cache-Control: Mencegah browser/CDN menyimpan HTML lama -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- SEO -->
    <title>KaiwaDoJo — Platform Interaktif Belajar Bahasa Jepang</title>
    <meta name="description" content="KaiwaDoJo adalah platform interaktif belajar bahasa Jepang dengan kelas live, materi terstruktur, dan latihan harian yang menyenangkan." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="KaiwaDoJo" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="KaiwaDoJo — Platform Interaktif Belajar Bahasa Jepang" />
    <meta property="og:description" content="KaiwaDoJo adalah platform interaktif belajar bahasa Jepang dengan kelas live, materi terstruktur, dan latihan harian yang menyenangkan." />
    <meta property="og:image" content="/kaiwa-logo.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/kaiwa-logo.png" />
    <link rel="apple-touch-icon" href="/kaiwa-logo.png" />

    <!-- Resource Hints — Koneksi awal ke Supabase & CDN sebelum JS dimuat -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Mengawali handshake DNS dan SSL ke Supabase lebih awal -->
    <link rel="preconnect" href="https://qxxzanjxtsaumfjbgbcu.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://qxxzanjxtsaumfjbgbcu.supabase.co" />
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Fallback untuk browser tanpa JavaScript -->
    <noscript>
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:'Inter',system-ui,-apple-system,sans-serif;padding:24px;">
        <div style="max-width:400px;width:100%;text-align:center;background:#fff;border-radius:20px;padding:36px 24px;box-shadow:0 4px 24px rgba(0,0,0,0.06);border:1px solid #e2e8f0;">
          <div style="font-size:36px;margin-bottom:16px;">🔒</div>
          <h2 style="font-size:18px;font-weight:800;color:#1e293b;margin:0 0 8px;">JavaScript Diperlukan</h2>
          <p style="font-size:13px;color:#64748b;line-height:1.6;margin:0;font-weight:500;">
            Aplikasi KaiwaDojo memerlukan JavaScript untuk berjalan.
            Silakan aktifkan JavaScript di pengaturan browser Anda, lalu muat ulang halaman ini.
          </p>
        </div>
      </div>
    </noscript>

    <!-- Fallback untuk browser yang tidak mendukung ES Module / sangat lawas -->
    <script nomodule>
      (function() {
        var root = document.getElementById('root');
        if (root) {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f8fafc;font-family:system-ui,-apple-system,sans-serif;padding:24px;">'
            + '<div style="max-width:400px;width:100%;text-align:center;background:#fff;border-radius:20px;padding:36px 24px;box-shadow:0 4px 24px rgba(0,0,0,0.06);border:1px solid #e2e8f0;">'
            + '<div style="font-size:36px;margin-bottom:16px;">⚠️</div>'
            + '<h2 style="font-size:18px;font-weight:800;color:#1e293b;margin:0 0 8px;">Browser Tidak Didukung</h2>'
            + '<p style="font-size:13px;color:#64748b;line-height:1.6;margin:0 0 20px;font-weight:500;">'
            + 'Browser Anda terlalu lama dan tidak dapat menjalankan aplikasi KaiwaDojo. '
            + 'Silakan perbarui browser ke versi terbaru (Chrome, Firefox, Safari, atau Edge).</p>'
            + '<a href="https://browsehappy.com" style="display:inline-block;background:#B91C1C;color:#fff;padding:12px 24px;border-radius:14px;text-decoration:none;font-weight:800;font-size:13px;">Perbarui Browser →</a>'
            + '</div></div>';
        }
      })();
    </script>
  </body>
</html>
