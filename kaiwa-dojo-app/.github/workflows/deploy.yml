name: Deploy KaiwaDoJo ke CyberPanel / Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via FTPS
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || '/api' }}
          VITE_ADMIN_WA_NUMBER: ${{ secrets.VITE_ADMIN_WA_NUMBER || '087875018001' }}

      - name: Copy API Backend & .htaccess ke dist/
        run: |
          cp -r api dist/api
          cp public/.htaccess dist/.htaccess || true

      - name: Deploy via SFTP ke Server
        uses: wlixcc/sftp-action@v3.0
        with:
          host: ${{ secrets.FTP_SERVER || '36.50.114.44' }}
          user: ${{ secrets.FTP_USERNAME }}
          pass: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 22 }}
          local_path: './dist/*'
          remote_path: ${{ secrets.FTP_SERVER_DIR || './' }}
          sftpArgs: '-o ConnectTimeout=60'



