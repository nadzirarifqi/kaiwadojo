name: Deploy KaiwaDoJo ke CyberPanel / Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy via FTPS
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE || '/api' }}
          VITE_ADMIN_WA_NUMBER: ${{ secrets.VITE_ADMIN_WA_NUMBER || '087875018001' }}

      - name: Copy API Backend & .htaccess ke dist/
        run: |
          cp -r api dist/api
          cp public/.htaccess dist/.htaccess || true

      - name: Deploy via FTPS ke Server
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || '36.50.114.44' }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          security: loose
          local-dir: ./dist/
          server-dir: ${{ secrets.FTP_SERVER_DIR || 'public_html/' }}
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state.json
          timeout: 60000
          log-level: verbose
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .ftp-deploy-sync-state.json
            uploads/**
            kaiwa-1-courses/**
            kaiwa-2-courses/**


